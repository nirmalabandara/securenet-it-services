<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3B6EF6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="126" stroke="rgba(255,255,255,0.08)" stroke-width="4" fill="none" />

  <!-- Centered Diamond Symbol -->
  <g filter="url(#glow)">
    <polygon points="256 96 416 256 256 416 96 256" stroke="#3B6EF6" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="256" cy="256" r="48" fill="#3B6EF6" />
  </g>
</svg>
