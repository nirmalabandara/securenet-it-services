<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" fill="none" width="100%" height="100%">
  <!-- SecureNet Diamond Glyph -->
  <g transform="translate(10, 10)">
    <!-- Outer Diamond Stroke -->
    <polygon points="22 2 42 22 22 42 2 22" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Inner Core Dot -->
    <circle cx="22" cy="22" r="5.5" fill="#2563EB" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(68, 42)">
    <text font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="0.02em" fill="#0F172A">
      SECURE<tspan fill="#2563EB">NET</tspan>
    </text>
  </g>
</svg>
